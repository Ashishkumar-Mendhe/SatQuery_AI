[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "satquery-backend"
version = "0.1.0"
description = "SatQuery AI Phase 1 FastAPI foundation"
requires-python = ">=3.13,<3.15"
dependencies = [
  "alembic==1.19.2",
  "fastapi==0.141.1",
  "h5py==3.16.0",
  "httpx2==2.12.0",
  "numpy==2.5.3",
  "psycopg[binary]==3.3.5",
  "pydantic-settings==2.15.0",
  "rasterio==1.5.1",
  "rio-tiler==9.4.4",
  "sqlalchemy[asyncio]==2.0.52",
  "uvicorn==0.52.4",
]

[project.optional-dependencies]
dev = [
  "mypy==2.3.1",
  "pip-tools==7.6.1",
  "pytest==9.1.1",
  "ruff==0.16.6",
]
grounding = [
  "pillow==12.3.0",
  "torch==2.14.0",
  "transformers==5.17.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = [
  "integration: requires an explicitly isolated PostgreSQL/PostGIS test database",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["satquery"]
mypy_path = "src"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "alembic.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "rasterio.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "h5py.*"
ignore_missing_imports = true
